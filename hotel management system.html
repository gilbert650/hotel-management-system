<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hotel Management System</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6f9;
}

/* HEADER */
header{
    background:#1e3d59;
    color:white;
    padding:20px;
    text-align:center;
}

header h1{
    font-size:35px;
}

/* NAV */
nav{
    background:#16324f;
    padding:15px;
    display:flex;
    justify-content:center;
    gap:20px;
}

nav button{
    background:#ff9800;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:5px;
    cursor:pointer;
    font-weight:bold;
}

/* MAIN */
.container{
    padding:20px;
}

/* CARDS */
.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.2);
    text-align:center;
}

.card h2{
    color:#1e3d59;
}

.card .number{
    font-size:40px;
    color:#ff9800;
    margin-top:10px;
}

/* FORM */
.form-section{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.2);
    margin-bottom:20px;
}

.form-section h2{
    margin-bottom:15px;
    color:#1e3d59;
}

input,select{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:5px;
}

button.submit{
    background:#1e88e5;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:5px;
    cursor:pointer;
    font-weight:bold;
}

/* TABLE */
table{
    width:100%;
    border-collapse:collapse;
    background:white;
    box-shadow:0 2px 8px rgba(0,0,0,0.2);
}

table th{
    background:#1e3d59;
    color:white;
    padding:12px;
}

table td{
    padding:12px;
    border-bottom:1px solid #ddd;
    text-align:center;
}

.delete-btn{
    background:red;
    color:white;
    border:none;
    padding:8px 12px;
    border-radius:5px;
    cursor:pointer;
}

/* FOOTER */
footer{
    background:#1e3d59;
    color:white;
    text-align:center;
    padding:15px;
    margin-top:20px;
}

@media(max-width:768px){
    table{
        font-size:12px;
    }
}
</style>
</head>
<body>

<header>
    <h1>🏨 Hotel Management System</h1>
    <p>Hotel Booking & Room Management</p>
</header>

<nav>
    <button onclick="showBookings()">Bookings</button>
    <button onclick="showRooms()">Rooms</button>
    <button onclick="showCustomers()">Customers</button>
</nav>

<div class="container">

    <!-- DASHBOARD -->
    <div class="cards">

        <div class="card">
            <h2>Total Rooms</h2>
            <div class="number" id="roomsCount">50</div>
        </div>

        <div class="card">
            <h2>Booked Rooms</h2>
            <div class="number" id="bookedCount">0</div>
        </div>

        <div class="card">
            <h2>Available Rooms</h2>
            <div class="number" id="availableCount">50</div>
        </div>

        <div class="card">
            <h2>Total Customers</h2>
            <div class="number" id="customerCount">0</div>
        </div>

    </div>

    <!-- BOOKING FORM -->
    <div class="form-section">
        <h2>Room Booking</h2>

        <input type="text" id="name" placeholder="Customer Name">

        <input type="email" id="email" placeholder="Customer Email">

        <select id="roomType">
            <option>Single Room</option>
            <option>Double Room</option>
            <option>VIP Suite</option>
        </select>

        <input type="number" id="roomNumber" placeholder="Room Number">

        <input type="date" id="checkin">

        <input type="date" id="checkout">

        <button class="submit" onclick="bookRoom()">
            Book Room
        </button>
    </div>

    <!-- BOOKINGS TABLE -->
    <table>

        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Room</th>
                <th>Type</th>
                <th>Check In</th>
                <th>Check Out</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="bookingTable"></tbody>

    </table>

</div>

<footer>
    Hotel Management System Using HTML, CSS, JavaScript, Node.js & SQL Ready
</footer>

<script>

/*
==========================================
NODE.JS + SQL BACKEND EXAMPLE
==========================================

CREATE DATABASE hotel_management;

USE hotel_management;

CREATE TABLE bookings(
    id INT AUTO_INCREMENT PRIMARY KEY,
    name VARCHAR(100),
    email VARCHAR(100),
    room_type VARCHAR(100),
    room_number INT,
    checkin_date DATE,
    checkout_date DATE
);

==========================================
NODE.JS SERVER EXAMPLE
==========================================

const express = require("express");
const mysql = require("mysql2");
const app = express();

app.use(express.json());

const db = mysql.createConnection({
    host:"localhost",
    user:"root",
    password:"",
    database:"hotel_management"
});

db.connect();

app.post("/book",(req,res)=>{
    const data = req.body;

    db.query(
        "INSERT INTO bookings(name,email,room_type,room_number,checkin_date,checkout_date) VALUES(?,?,?,?,?,?)",
        [
            data.name,
            data.email,
            data.room_type,
            data.room_number,
            data.checkin,
            data.checkout
        ],
        (err,result)=>{
            if(err) throw err;

            res.send("Booking successful");
        }
    );
});

app.listen(3000);

==========================================
*/

// FRONTEND SYSTEM

let bookings = [];

const bookingTable = document.getElementById("bookingTable");

function updateDashboard(){

    document.getElementById("bookedCount")
    .innerText = bookings.length;

    document.getElementById("availableCount")
    .innerText = 50 - bookings.length;

    document.getElementById("customerCount")
    .innerText = bookings.length;
}

function bookRoom(){

    const name = document.getElementById("name").value;

    const email = document.getElementById("email").value;

    const roomType = document.getElementById("roomType").value;

    const roomNumber = document.getElementById("roomNumber").value;

    const checkin = document.getElementById("checkin").value;

    const checkout = document.getElementById("checkout").value;

    if(
        !name ||
        !email ||
        !roomNumber ||
        !checkin ||
        !checkout
    ){
        alert("Please fill all fields");
        return;
    }

    const booking = {
        id: Date.now(),
        name,
        email,
        roomType,
        roomNumber,
        checkin,
        checkout
    };

    bookings.push(booking);

    renderBookings();

    updateDashboard();

    clearForm();

    alert("Room booked successfully!");
}

function renderBookings(){

    bookingTable.innerHTML = "";

    bookings.forEach((booking,index)=>{

        bookingTable.innerHTML += `
        <tr>
            <td>${booking.id}</td>
            <td>${booking.name}</td>
            <td>${booking.email}</td>
            <td>${booking.roomNumber}</td>
            <td>${booking.roomType}</td>
            <td>${booking.checkin}</td>
            <td>${booking.checkout}</td>

            <td>
                <button class="delete-btn"
                onclick="deleteBooking(${index})">
                    Delete
                </button>
            </td>
        </tr>
        `;
    });
}

function deleteBooking(index){

    bookings.splice(index,1);

    renderBookings();

    updateDashboard();
}

function clearForm(){

    document.getElementById("name").value = "";

    document.getElementById("email").value = "";

    document.getElementById("roomNumber").value = "";

    document.getElementById("checkin").value = "";

    document.getElementById("checkout").value = "";
}

// NAVIGATION DEMO
function showBookings(){
    alert("Viewing all bookings");
}

function showRooms(){
    alert("Viewing hotel rooms");
}

function showCustomers(){
    alert("Viewing customers");
}

updateDashboard();

</script>

</body>
</html>
